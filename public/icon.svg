<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent Gradient for Roof -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- House Roof Emblem above DP -->
  <path d="M 160 165 L 256 95 L 352 165" 
        fill="none" 
        stroke="url(#gold-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- DP Lettering -->
  <g fill="url(#text-grad)" filter="url(#glow)">
    <!-- Letter D -->
    <path d="M 140 195 H 205 C 245 195 272 218 272 258 C 272 298 245 321 205 321 H 140 V 195 Z M 176 226 V 290 H 202 C 224 290 236 278 236 258 C 236 238 224 226 202 226 H 176 Z" />

    <!-- Letter P -->
    <path d="M 285 195 H 350 C 385 195 408 215 408 248 C 408 281 385 301 350 301 H 321 V 380 H 285 V 195 Z M 321 226 V 270 H 347 C 363 270 372 261 372 248 C 372 235 363 226 347 226 H 321 Z" opacity="0.98" />
  </g>

  <!-- Tagline Dot / Accent -->
  <circle cx="256" cy="425" r="14" fill="url(#gold-grad)" />
</svg>
